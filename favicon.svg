<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg { fill: #000000; }
      .txt {
        fill: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "SF Pro Display", system-ui, sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #ffffff; }
        .txt { fill: #000000; }
      }
    </style>
  </defs>
  <rect class="bg" width="100" height="100" rx="22"/>
  <text class="txt" x="50" y="55" dominant-baseline="central" text-anchor="middle">KöDE</text>
</svg>